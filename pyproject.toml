[project]
name = "avito-ranking"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "catboost==1.2.10",
    "click==8.1.8",
    "numpy==1.26.4",
    "polars==1.14.0",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "matplotlib>=3.9,<4",
    "lightgbm==4.6.0",
    "optuna>=4,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
